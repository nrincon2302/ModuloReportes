services:

  nginx:
    image: nginx:alpine
    container_name: shiny-proxy
    ports:
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - shiny1
      - shiny2
      - shiny3
      - shiny4
    restart: unless-stopped

  shiny1:
    build: .
    image: modulo-reportes
    env_file: .env
    ports:
      - "4001:3838"
    restart: unless-stopped

  shiny2:
    image: modulo-reportes
    env_file: .env
    ports:
      - "4002:3838"
    restart: unless-stopped

  shiny3:
    image: modulo-reportes
    env_file: .env
    ports:
      - "4003:3838"
    restart: unless-stopped

  shiny4:
    image: modulo-reportes
    env_file: .env
    ports:
      - "4004:3838"
    restart: unless-stopped
