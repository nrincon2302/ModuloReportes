services:

  nginx:
    image: nginx:alpine
    container_name: shiny-proxy
    ports:
      - "4000:443"   # ahora HTTPS
      - "4005:80"    # opcional (redirect)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - shiny1
      - shiny2
      - shiny3
      - shiny4
    restart: unless-stopped

  shiny1:
    build: .
    image: modulo-reportes
    env_file: .env
    ports:
      - "4001:3838"
    restart: unless-stopped

  shiny2:
    image: modulo-reportes
    env_file: .env
    ports:
      - "4002:3838"
    restart: unless-stopped

  shiny3:
    image: modulo-reportes
    env_file: .env
    ports:
      - "4003:3838"
    restart: unless-stopped

  shiny4:
    image: modulo-reportes
    env_file: .env
    ports:
      - "4004:3838"
    restart: unless-stopped
