events {}

http {

  upstream shiny_backend {
    ip_hash;   # sticky session

    server host.docker.internal:4001;
    server host.docker.internal:4002;
    server host.docker.internal:4003;
    server host.docker.internal:4004;

  }

  server {

    listen 80;

    location / {

      proxy_pass http://shiny_backend;

      proxy_http_version 1.1;

      # NECESARIO para websockets
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # MUY importante para descargas y apps pesadas
      proxy_buffering off;
      proxy_request_buffering off;

      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 60s;

      # tamaño de descargas
      client_max_body_size 500M;

    }

  }

}