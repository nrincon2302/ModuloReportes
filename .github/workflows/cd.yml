name: CD - Deploy to Docker Hub, Shinyapps.io and On-prem

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/modulo-reportes:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/modulo-reportes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcurl4-openssl-dev libssl-dev \
            libxml2-dev libglpk-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff5-dev libjpeg-dev \
            libx11-dev pandoc

      - name: Ensure rlang >= 1.3.0
        run: |
          R -e "if (!requireNamespace('rlang', quietly=TRUE) || packageVersion('rlang') < '1.3.0') install.packages('rlang', repos='https://cran.rstudio.com/')"
          
      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/renv
            ~/.cache/R/renv
            renv/library
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore renv
        run: |
          if [ -f "renv.lock" ]; then
            R -e "if (!requireNamespace('renv', quietly=TRUE)) install.packages('renv', repos='https://cran.rstudio.com/'); renv::restore(prompt=FALSE)"
          else
            echo "No renv.lock found, skipping renv restore"
          fi

      - name: Install rsconnect
        run: |
          R -e "if (!requireNamespace('rsconnect', quietly=TRUE)) install.packages('rsconnect', repos='https://cran.rstudio.com/')"

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          FASTAPI_PASSWORD: ${{ secrets.FASTAPI_PASSWORD }}
          FASTAPI_URL: ${{ secrets.FASTAPI_URL }}
          FASTAPI_USERNAME: ${{ secrets.FASTAPI_USERNAME }}
          ODK_EMAIL: ${{ secrets.ODK_EMAIL }}
          ODK_PASSWORD: ${{ secrets.ODK_PASSWORD }}
          ODK_PROJECT_ID: ${{ secrets.ODK_PROJECT_ID }}
          ODK_URL: ${{ secrets.ODK_URL }}
        run: |
          R -e "
            vars <- c('FASTAPI_PASSWORD','FASTAPI_URL','FASTAPI_USERNAME',
                      'ODK_EMAIL','ODK_PASSWORD','ODK_PROJECT_ID','ODK_URL')
            con <- file('app/.Renviron', 'w')
            writeLines(sapply(vars, function(v) paste0(v, '=', Sys.getenv(v))), con)
            close(con)
          "
          R -e "
            rsconnect::setAccountInfo(
              name   = Sys.getenv('SHINYAPPS_ACCOUNT'),
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )
            rsconnect::deployApp(
              appDir       = 'app',
              appName      = 'Dashboard-Shiny',
              account      = Sys.getenv('SHINYAPPS_ACCOUNT'),
              forceUpdate  = TRUE,
              launch.browser = FALSE
            )
          "
